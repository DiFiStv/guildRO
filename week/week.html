<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дела гильдии - SUPER местечко</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="week.css">
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="../index.html" class="home-btn">🏠 На главную</a>
            <span class="page-title">📋 Еженедельные активности</span>
            <a href="../shadow.html" class="switch-btn">🔨 К теням →</a>
        </div>

        <div class="week-header">
            <h1>📋 ЕЖЕНЕДЕЛЬНЫЕ АКТИВНОСТИ ГИЛЬДИИ SUPER</h1>
            <div class="week-controls">
                <div class="controls-left">
                    <button id="applyBtn" class="save-btn save-apply" style="display:none;">💾 Применить</button>
                </div>
                <div class="controls-right">
                    <span id="weekInfo" class="week-info">📅 Неделя: Загрузка...</span>
                </div>
            </div>
        </div>

        <!-- Вкладки -->
        <div class="tabs">
            <button class="tab-btn" data-tab="guild">🛡️ PVP активности</button>
            <button class="tab-btn active" data-tab="doomsday">⚔️ Битва судного дня</button>
            <button class="tab-btn" data-tab="thanatos">🏰 Башня Танатоса</button>
            <button class="tab-btn" data-tab="tower">🗼 Бесконечная башня</button>
        </div>

        <!-- Контейнер для таблиц -->
        <div id="tableContainer">
            <div style="text-align: center; color: #888; padding: 40px;">Загрузка данных...</div>
        </div>

        <!-- КВМ Очки -->
        <div class="kvm-section">
            <h3>📊 КВМ ОЧКИ</h3>
            <div class="kvm-row">
                <div class="kvm-item">
                    <label>Вторник:</label>
                    <input type="number" id="kvmTuePoints" min="0" max="9999" value="0" oninput="updateKvmTotal()">
                </div>
                <div class="kvm-item">
                    <label>Четверг:</label>
                    <input type="number" id="kvmThuPoints" min="0" max="9999" value="0" oninput="updateKvmTotal()">
                </div>
                <div class="kvm-item">
                    <label>Воскресенье:</label>
                    <input type="number" id="kvmSunPoints" min="0" max="9999" value="0" oninput="updateKvmTotal()">
                </div>
            </div>
            <div class="kvm-total" id="kvmTotal">
                <span>📊 Итого КВМ очков: <strong id="kvmTotalSum">0</strong></span>
            </div>
        </div>

        <!-- Иномир -->
        <div class="otherworld-section">
            <div class="otherworld-cloud" id="otherworldCloud">
                <div class="particles">
                    <span class="particle">✦</span><span class="particle">✦</span>
                    <span class="particle">✦</span><span class="particle">✦</span>
                    <span class="particle">✦</span><span class="particle">✦</span>
                    <span class="particle">✦</span><span class="particle">✦</span>
                </div>
                <div class="otherworld-content">
                    <div class="otherworld-title" id="otherworldTitle">🌌 ИНОМИР</div>
                    <div class="otherworld-info" id="otherworldInfo">Набирает силы...</div>
                </div>
            </div>

            <!-- Редактор Иномира (только в dynamic) -->
            <div id="otherworldEditor" class="otherworld-editor" style="display:none;">
                <h3>⚙️ Настройка Иномира</h3>
                <div class="editor-row">
                    <label>Дата:</label>
                    <input type="date" id="owDate">
                </div>
                <div class="editor-row">
                    <label>День недели:</label>
                    <select id="owDay">
                        <option value="">—</option>
                        <option value="ПН">Понедельник</option>
                        <option value="ВТ">Вторник</option>
                        <option value="СР">Среда</option>
                        <option value="ЧТ">Четверг</option>
                        <option value="ПТ">Пятница</option>
                        <option value="СБ">Суббота</option>
                        <option value="ВС">Воскресенье</option>
                    </select>
                </div>
                <div class="editor-row">
                    <label>Время:</label>
                    <select id="owTime"></select>
                </div>
                <div class="editor-row">
                    <label>
                        <input type="checkbox" id="owActive"> Активно
                    </label>
                </div>
            </div>
        </div>

        <div class="legend">
            <span class="legend-item">
                <span class="legend-symbol symbol-ok">✅</span> Выполнено
            </span>
            <span class="legend-item">
                <span class="legend-symbol symbol-no">❌</span> Не выполнено
            </span>
            <span class="legend-item tower-legend">
                <span class="legend-symbol symbol-gold">✨16</span> 16-й этаж (золотой)
            </span>
        </div>
    </div>

    <script src="week.js"></script>
</body>
</html>
